name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parity guard (code blocks must be identical)
        run: python scripts/check_code_blocks_parity.py

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Create /fr/ alias (FR at / + /fr/ for strict /fr/+ /en/ URLs)
        run: |
          # mkdocs-static-i18n with suffix puts FR at site/ (root) and EN at site/en/
          # Duplicate FR to site/fr/ so both / and /fr/ serve FR (user expects /fr/ + /en/)
          if [ -d site ]; then
            mkdir -p site/fr
            cp -r site/* site/fr/ 2>/dev/null || true
            # avoid infinite recursion: remove nested fr/fr if created
            rm -rf site/fr/fr site/fr/en 2>/dev/null || true
            echo "Created site/fr/ alias with $(ls site/fr | wc -l) entries"
          fi

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
